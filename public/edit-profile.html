<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование профиля</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .profile-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .avatar-section {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
        }
        .avatar-preview {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #3498db;
            margin-bottom: 15px;
            background: #e0e0e0;
        }
        .upload-area {
            margin: 15px auto;
            padding: 15px;
            max-width: 300px;
            border: 2px dashed #3498db;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover {
            background: #e8f4f8;
        }
        .file-input {
            display: none;
        }
        .avatar-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }
        .btn-upload, .btn-delete {
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
            border: none;
            color: white;
        }
        .btn-upload {
            background: #27ae60;
        }
        .btn-delete {
            background: #e74c3c;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-group-full {
            grid-column: span 2;
        }
        .bio-textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            resize: vertical;
            min-height: 100px;
        }
        .password-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            border-left: 4px solid #e74c3c;
        }
        .message {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .btn-save {
            background: #27ae60;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-save:hover {
            background: #219a52;
        }
        .btn-cancel {
            background: #95a5a6;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .form-group-full {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="container">
            <h1>✏️ Редактирование профиля</h1>
            <div class="nav-bar">
                <nav>
                    <a href="/">Главная</a>
                    <a href="/profile.html">← Назад в профиль</a>
                    <div class="auth-buttons">
                        <a href="/login.html">Вход</a>
                        <a href="/register.html">Регистрация</a>
                    </div>
                </nav>
            </div>
        </div>
    </header>

    <main class="container profile-container">
        <div id="message" class="message"></div>

        <div class="avatar-section">
            <h3>Фото профиля</h3>
            <img id="avatarPreview" class="avatar-preview" src="/images/default-avatar.png" alt="Avatar">
            
            <div class="upload-area" id="uploadArea">
                <p>📁 Нажмите для выбора фото</p>
            </div>
            <input type="file" id="fileInput" class="file-input" accept="image/jpeg,image/png,image/gif,image/webp">
            
            <div class="avatar-actions">
                <button type="button" class="btn-upload" id="uploadBtn">📷 Загрузить</button>
                <button type="button" class="btn-delete" id="deleteBtn">🗑️ Удалить</button>
            </div>
        </div>

        <form id="profileForm">
            <div class="form-row">
                <div class="form-group">
                    <label>👤 Имя пользователя</label>
                    <input type="text" id="username" disabled style="background: #f0f0f0;">
                </div>
                <div class="form-group">
                    <label>📧 Email *</label>
                    <input type="email" id="email" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>👨‍💼 Полное имя</label>
                    <input type="text" id="full_name" placeholder="Введите ваше полное имя">
                </div>
                <div class="form-group">
                    <label>📞 Телефон</label>
                    <input type="tel" id="phone" placeholder="+7 (xxx) xxx-xx-xx">
                </div>
            </div>

            <div class="form-group-full">
                <label>📝 О себе</label>
                <textarea id="bio" class="bio-textarea" placeholder="Расскажите немного о себе..."></textarea>
            </div>

            <div class="password-section">
                <h3>🔐 Смена пароля</h3>
                <div class="form-group">
                    <label>Текущий пароль</label>
                    <input type="password" id="current_password" placeholder="Введите текущий пароль">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Новый пароль</label>
                        <input type="password" id="new_password" placeholder="Минимум 6 символов">
                    </div>
                    <div class="form-group">
                        <label>Подтверждение пароля</label>
                        <input type="password" id="confirm_password" placeholder="Повторите новый пароль">
                    </div>
                </div>
                <small>✏️ Оставьте поля пароля пустыми, если не хотите его менять</small>
            </div>

            <div style="display: flex; gap: 15px; margin-top: 30px; justify-content: center;">
                <button type="submit" class="btn-save" id="saveBtn">💾 Сохранить изменения</button>
                <button type="button" class="btn-cancel" onclick="window.location.href='/profile.html'">Отмена</button>
            </div>
        </form>
    </main>

    <script src="/js/main.js"></script>
    <script>
        let userId = null;

        function showMessage(text, type = 'success') {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = text;
            msgDiv.className = `message ${type}`;
            msgDiv.style.display = 'block';
            setTimeout(() => {
                msgDiv.style.display = 'none';
            }, 3000);
        }

        // Загрузка данных пользователя
        async function loadUserData() {
            try {
                const meResponse = await fetch('/api/me');
                if (!meResponse.ok) {
                    window.location.href = '/login.html';
                    return;
                }
                const user = await meResponse.json();
                userId = user.id;
                
                const profileResponse = await fetch(`/api/profile/${userId}`);
                const profile = await profileResponse.json();
                
                document.getElementById('username').value = profile.username;
                document.getElementById('email').value = profile.email || '';
                document.getElementById('full_name').value = profile.full_name || '';
                document.getElementById('phone').value = profile.phone || '';
                document.getElementById('bio').value = profile.bio || '';
                
                const avatarUrl = profile.avatar || '/images/default-avatar.png';
                document.getElementById('avatarPreview').src = avatarUrl;
            } catch (error) {
                console.error('Ошибка:', error);
                showMessage('Ошибка загрузки данных', 'error');
            }
        }

        // Сохранение профиля
        const saveBtn = document.getElementById('saveBtn');
        const profileForm = document.getElementById('profileForm');
        
        profileForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            console.log('Форма отправлена!');
            
            const email = document.getElementById('email').value;
            const full_name = document.getElementById('full_name').value;
            const phone = document.getElementById('phone').value;
            const bio = document.getElementById('bio').value;
            const current_password = document.getElementById('current_password').value;
            const new_password = document.getElementById('new_password').value;
            const confirm_password = document.getElementById('confirm_password').value;
            
            if (!email) {
                showMessage('Email обязателен для заполнения', 'error');
                return;
            }
            
            // Проверка пароля
            if (new_password || current_password) {
                if (!current_password) {
                    showMessage('Введите текущий пароль для смены пароля', 'error');
                    return;
                }
                if (new_password.length < 6) {
                    showMessage('Новый пароль должен быть не менее 6 символов', 'error');
                    return;
                }
                if (new_password !== confirm_password) {
                    showMessage('Новые пароли не совпадают', 'error');
                    return;
                }
            }
            
            try {
                const response = await fetch(`/api/profile/${userId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: email,
                        full_name: full_name,
                        phone: phone,
                        bio: bio,
                        current_password: current_password,
                        new_password: new_password
                    })
                });
                
                const data = await response.json();
                console.log('Ответ сервера:', data);
                
                if (response.ok) {
                    showMessage('✅ Профиль успешно обновлен!', 'success');
                    setTimeout(() => {
                        window.location.href = '/profile.html';
                    }, 1500);
                } else {
                    showMessage(data.error || 'Ошибка обновления', 'error');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                showMessage('Ошибка сети', 'error');
            }
        });

        // Аватар
        let selectedFile = null;
        
        document.getElementById('uploadArea').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });

        document.getElementById('fileInput').addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('avatarPreview').src = event.target.result;
                };
                reader.readAsDataURL(selectedFile);
                showMessage('Файл выбран. Нажмите "Загрузить"', 'success');
            }
        });

        document.getElementById('uploadBtn').addEventListener('click', async () => {
            if (!selectedFile) {
                showMessage('Сначала выберите файл', 'error');
                return;
            }
            
            const formData = new FormData();
            formData.append('avatar', selectedFile);
            
            try {
                const response = await fetch(`/api/profile/${userId}/upload-avatar`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('avatarPreview').src = data.avatar + '?t=' + Date.now();
                    showMessage('✅ Аватар загружен!', 'success');
                    selectedFile = null;
                    document.getElementById('fileInput').value = '';
                } else {
                    showMessage(data.error || 'Ошибка загрузки', 'error');
                }
            } catch (error) {
                showMessage('Ошибка сети', 'error');
            }
        });

        document.getElementById('deleteBtn').addEventListener('click', async () => {
            if (!confirm('Удалить аватар?')) return;
            
            try {
                const response = await fetch(`/api/profile/${userId}/avatar`, { method: 'DELETE' });
                const data = await response.json();
                if (response.ok) {
                    document.getElementById('avatarPreview').src = '/images/default-avatar.png';
                    showMessage('✅ Аватар удален', 'success');
                } else {
                    showMessage(data.error || 'Ошибка', 'error');
                }
            } catch (error) {
                showMessage('Ошибка сети', 'error');
            }
        });

        loadUserData();
        
        // Проверяем, что кнопка существует
        console.log('Кнопка сохранения:', document.getElementById('saveBtn'));
        console.log('Форма:', document.getElementById('profileForm'));
    </script>
</body>
</html>
