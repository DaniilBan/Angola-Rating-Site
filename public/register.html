<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Экономическое развитие Бангладеш</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .auth-container {
            max-width: 450px;
            margin: 50px auto;
            background: white;
            border-radius: 15px;
            padding: 35px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .auth-container h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #3498db;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .auth-link {
            text-align: center;
            margin-top: 20px;
        }
        .auth-link a {
            color: #3498db;
            text-decoration: none;
        }
        .error-message {
            background: #fee;
            color: #c33;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }
        .success-message {
            background: #efe;
            color: #3c3;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }
        .role-selector {
            margin: 20px 0;
        }
        .role-option {
            display: flex;
            align-items: center;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .role-option:hover {
            border-color: #3498db;
            background: #f0f8ff;
        }
        .role-option.selected {
            border-color: #3498db;
            background: #e8f4f8;
        }
        .role-option input {
            width: auto;
            margin-right: 15px;
            margin-top: 0;
        }
        .role-option label {
            flex: 1;
            cursor: pointer;
            margin: 0;
            font-weight: normal;
        }
        .role-desc {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        .admin-code {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: #fff3cd;
            border-radius: 8px;
            border-left: 4px solid #ffc107;
        }
        .admin-code.show {
            display: block;
        }
        .admin-code label {
            font-weight: bold;
            color: #856404;
        }
        .admin-code input {
            border-color: #ffc107;
        }
        .info-text {
            background: #d1ecf1;
            border-left: 4px solid #17a2b8;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>📝 Регистрация</h2>
        
        <div class="info-text">
            💡 Обычные пользователи могут просматривать данные. 
            Администраторы имеют доступ к панели управления.
        </div>
        
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        
        <form id="registerForm">
            <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text" id="username" required minlength="3">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="password" required minlength="6">
            </div>
            <div class="form-group">
                <label>Подтверждение пароля</label>
                <input type="password" id="confirmPassword" required>
            </div>
            
            <div class="role-selector">
                <label style="display: block; margin-bottom: 10px;"><strong>Выберите роль:</strong></label>
                
                <div class="role-option" onclick="selectRole('user')" id="roleUser">
                    <input type="radio" name="role" value="user" checked>
                    <label>
                        <strong>👤 Обычный пользователь</strong>
                        <div class="role-desc">Доступ к просмотру данных и рейтингов</div>
                    </label>
                </div>
                
                <div class="role-option" onclick="selectRole('admin')" id="roleAdmin">
                    <input type="radio" name="role" value="admin">
                    <label>
                        <strong>👑 Администратор</strong>
                        <div class="role-desc">Полный доступ, включая управление дивизионами</div>
                    </label>
                </div>
            </div>
            
            <div id="adminCodeDiv" class="admin-code">
                <label>🔐 Код администратора:</label>
                <input type="password" id="adminCode" placeholder="Введите секретный код">
                <div style="font-size: 12px; color: #856404; margin-top: 5px;">
                    ⚠️ Требуется специальный код для регистрации как администратор
                </div>
            </div>
            
            <button type="submit" class="btn">Зарегистрироваться</button>
        </form>
        
        <div class="auth-link">
            Уже есть аккаунт? <a href="/login.html">Войти</a>
        </div>
    </div>

    <script>
        function selectRole(role) {
            document.getElementById('roleUser').classList.remove('selected');
            document.getElementById('roleAdmin').classList.remove('selected');
            
            if (role === 'user') {
                document.getElementById('roleUser').classList.add('selected');
                document.getElementById('roleUser').querySelector('input').checked = true;
                document.getElementById('adminCodeDiv').classList.remove('show');
            } else {
                document.getElementById('roleAdmin').classList.add('selected');
                document.getElementById('roleAdmin').querySelector('input').checked = true;
                document.getElementById('adminCodeDiv').classList.add('show');
            }
        }
        
        document.getElementById('roleUser').classList.add('selected');
        
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const role = document.querySelector('input[name="role"]:checked').value;
            const adminCode = document.getElementById('adminCode').value;
            
            if (password !== confirmPassword) {
                showMessage('errorMessage', 'Пароли не совпадают');
                return;
            }
            
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password, role, adminCode })
                });
                
                const data = await response.json();
                if (response.ok) {
                    showMessage('successMessage', 'Регистрация успешна! Перенаправление...', false);
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                } else {
                    showMessage('errorMessage', data.error || 'Ошибка регистрации');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                showMessage('errorMessage', 'Ошибка сети');
            }
        });
        
        function showMessage(elementId, message, isError = true) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
            if (!isError) {
                element.classList.add('success-message');
                element.classList.remove('error-message');
            }
            setTimeout(() => {
                element.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
