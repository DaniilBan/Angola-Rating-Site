<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - Экономическое развитие Анголы</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .profile-header {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #3498db;
        }
        .profile-name h2 {
            margin: 0 0 5px 0;
            color: #2c3e50;
        }
        .profile-name p {
            color: #666;
            margin: 0;
        }
        .edit-btn {
            background: #3498db;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .info-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
        }
        .info-card h3 {
            margin: 0 0 10px 0;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .info-label {
            font-weight: bold;
            color: #555;
        }
        .bio-text {
            line-height: 1.5;
            margin-top: 10px;
        }
        .role-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }
        .role-admin {
            background: #e74c3c;
            color: white;
        }
        .role-user {
            background: #3498db;
            color: white;
        }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="container">
            <h1>👤 Личный кабинет</h1>
            <div class="nav-bar">
                <nav>
                    <a href="/">Главная</a>
                    <a href="/rating.html">🏆 Рейтинг</a>
                    <a href="/economy.html">📊 Экономика</a>
                    <div class="auth-buttons">
                        <a href="/login.html">Вход</a>
                        <a href="/register.html">Регистрация</a>
                    </div>
                </nav>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="card" id="profileContent">
            <div class="loader"></div>
        </div>
    </main>

    <script src="/js/main.js"></script>
    <script>
        async function loadProfile() {
            try {
                // Проверяем авторизацию
                const meResponse = await fetch('/api/me');
                if (!meResponse.ok) {
                    window.location.href = '/login.html';
                    return;
                }
                
                const user = await meResponse.json();
                const userId = user.id;
                
                // Загружаем полные данные профиля
                const profileResponse = await fetch(`/api/profile/${userId}`);
                if (!profileResponse.ok) {
                    throw new Error('Ошибка загрузки профиля');
                }
                
                const profile = await profileResponse.json();
                
                const roleBadge = profile.role === 'admin' 
                    ? '<span class="role-badge role-admin">👑 Администратор</span>' 
                    : '<span class="role-badge role-user">👤 Пользователь</span>';
                
                // Обновляем отображаемое имя в шапке
                const authButtons = document.querySelector('.auth-buttons');
                if (authButtons && authButtons.innerHTML.includes('Вход')) {
                    // Если шапка ещё не обновлена, обновляем
                    location.reload();
                    return;
                }
                
                document.getElementById('profileContent').innerHTML = `
                    <div class="profile-header">
                        <img src="${profile.avatar || '/images/default-avatar.png'}?t=${Date.now()}" alt="Avatar" class="profile-avatar">
                        <div class="profile-name">
                            <h2>${escapeHtml(profile.full_name || profile.username)} ${roleBadge}</h2>
                            <p>@${escapeHtml(profile.username)}</p>
                            <a href="/edit-profile.html" class="edit-btn">✏️ Редактировать профиль</a>
                        </div>
                    </div>
                    
                    <div class="info-grid">
                        <div class="info-card">
                            <h3>📋 Контактная информация</h3>
                            <div class="info-row">
                                <span class="info-label">Email:</span>
                                <span>${escapeHtml(profile.email)}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Телефон:</span>
                                <span>${escapeHtml(profile.phone) || '—'}</span>
                            </div>
                        </div>
                        
                        <div class="info-card">
                            <h3>📅 Аккаунт</h3>
                            <div class="info-row">
                                <span class="info-label">Дата регистрации:</span>
                                <span>${profile.created_at ? new Date(profile.created_at).toLocaleDateString('ru-RU') : '—'}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Последний вход:</span>
                                <span>${profile.last_login ? new Date(profile.last_login).toLocaleString('ru-RU') : '—'}</span>
                            </div>
                        </div>
                        
                        <div class="info-card">
                            <h3>📝 О себе</h3>
                            <div class="bio-text">
                                ${escapeHtml(profile.bio) || 'Пользователь пока ничего не рассказал о себе.'}
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('profileContent').innerHTML = '<p style="color: red;">Ошибка загрузки профиля. <a href="/">Вернуться на главную</a></p>';
            }
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Загружаем профиль
        loadProfile();
        
        // Проверяем авторизацию для шапки
        checkAuth();
    </script>
</body>
</html>
