<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Экономическое развитие Анголы</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-container">
        <h2>🔐 Вход в аккаунт</h2>
        <div id="errorMessage" class="error-message"></div>
        <form id="loginForm">
            <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn">Войти</button>
        </form>
        <div class="auth-link">
            Нет аккаунта? <a href="/register.html">Зарегистрироваться</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                if (response.ok) {
                    // Сохраняем роль в sessionStorage для быстрого доступа
                    sessionStorage.setItem('userRole', data.user.role);
                    window.location.href = '/';
                } else {
                    const errorDiv = document.getElementById('errorMessage');
                    errorDiv.textContent = data.error || 'Ошибка входа';
                    errorDiv.style.display = 'block';
                }
                // После успешного входа, обновляем last_login
                if (response.ok) {
                    fetch(`/api/profile/${data.user.id}/last-login`, { method: 'POST' });
                    sessionStorage.setItem('userRole', data.user.role);
                    window.location.href = '/';
                }
            } catch (error) {
                console.error('Ошибка:', error);
            }
        });
    </script>


</body>
</html>
