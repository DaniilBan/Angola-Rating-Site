<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ панель - Управление дивизионами Бангладеш</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .admin-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-number {
            font-size: 2em;
            font-weight: bold;
        }
        .form-panel {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #3498db;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
            color: #555;
        }
        .form-group input, .form-group select, .form-group textarea {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        .btn-primary {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-primary:hover {
            background: #2980b9;
        }
        .btn-danger {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-danger:hover {
            background: #c0392b;
        }
        .btn-warning {
            background: #f39c12;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-save {
            background: #27ae60;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-delete {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-small {
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
        .message {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .province-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .province-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 2px solid #3498db;
        }
        .province-fields {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin: 15px 0;
        }
        .field {
            display: flex;
            flex-direction: column;
        }
        .field label {
            font-size: 11px;
            color: #666;
            margin-bottom: 3px;
        }
        .field input {
            padding: 5px;
            font-size: 13px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .field textarea {
            padding: 5px;
            font-size: 13px;
            border: 1px solid #ddd;
            border-radius: 4px;
            resize: vertical;
            min-height: 60px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .search-box {
            margin-bottom: 20px;
            padding: 10px;
            background: white;
            border-radius: 5px;
        }
        .search-box input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .value-group {
            margin-bottom: 15px;
        }
        .value-group label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        .value-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="admin-header">
            <h1>🗄️ Панель администратора</h1>
            <p>Управление дивизионами Бангладеш</p>
            <div style="margin-top: 10px;">
                <a href="/" style="color: white; margin-right: 15px;">← На главную</a>
                <a href="/rating.html" style="color: white; margin-right: 15px;">🏆 Рейтинг</a>
                <a href="/economy.html" style="color: white;">📊 Экономика</a>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-box">
                <div class="stat-number" id="totalCount">0</div>
                <div>Всего дивизионов</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="attrCount">4</div>
                <div>Характеристик</div>
            </div>
        </div>

        <div id="message" class="message"></div>

        <!-- Форма добавления нового дивизиона -->
        <div class="form-panel">
            <h2>➕ Добавить новый дивизион</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Название *</label>
                    <input type="text" id="newName" placeholder="Например: Дакка">
                </div>
                <div class="form-group">
                    <label>Столица</label>
                    <input type="text" id="newCapital" placeholder="Например: Дакка">
                </div>
                <div class="form-group">
                    <label>Губернатор</label>
                    <input type="text" id="newGovernor" placeholder="Например: Абдул Маннан">
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label>Описание</label>
                    <textarea id="newDescription" rows="2" placeholder="Краткое описание дивизиона..."></textarea>
                </div>
            </div>
            <button onclick="addProvince()" class="btn-primary" style="margin-top:15px;">➕ Добавить дивизион</button>
        </div>

        <!-- Поиск -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Поиск дивизиона..." onkeyup="filterProvinces()">
        </div>

        <!-- Список дивизионов -->
        <div class="form-panel">
            <h2>✏️ Управление дивизионами</h2>
            <div id="provincesList"></div>
        </div>

        <!-- Быстрые действия -->
        <div class="form-panel">
            <h2>⚡ Быстрые действия</h2>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button onclick="addExampleProvinces()" class="btn-primary">📝 Добавить примеры</button>
                <button onclick="clearAllProvinces()" class="btn-danger">⚠️ Очистить все</button>
                <button onclick="refreshData()" class="btn-warning">🔄 Обновить</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно для редактирования характеристик -->
    <div id="valueModal" class="modal">
        <div class="modal-content">
            <h3>✏️ Редактирование характеристик</h3>
            <p id="modalProvinceName" style="color:#666; margin-bottom:15px;"></p>
            <div id="valueForm"></div>
            <div class="modal-actions">
                <button onclick="saveProvinceValues()" class="btn-primary">💾 Сохранить</button>
                <button onclick="closeValueModal()" class="btn-danger">Отмена</button>
            </div>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script>
        let allProvinces = [];
        let currentProvinceId = null;
        let currentProvinceName = '';

        function showMessage(text, type = 'success') {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = text;
            msgDiv.className = `message ${type}`;
            msgDiv.style.display = 'block';
            setTimeout(() => msgDiv.style.display = 'none', 3000);
        }

        // ==================== ЗАГРУЗКА ПРОВИНЦИЙ ====================

        async function loadProvinces() {
            try {
                const response = await fetch('/api/provinces');
                allProvinces = await response.json();
                updateStats();
                renderProvinces();
            } catch (error) {
                console.error('Ошибка:', error);
            }
        }

        function updateStats() {
            document.getElementById('totalCount').textContent = allProvinces.length;
        }

        function filterProvinces() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProvinces.filter(p => p.name.toLowerCase().includes(searchTerm));
            renderProvinces(filtered);
        }

        // ==================== ОТОБРАЖЕНИЕ ПРОВИНЦИЙ ====================

        function renderProvinces(provincesToShow = null) {
            const container = document.getElementById('provincesList');
            const provinces = provincesToShow || allProvinces;
            
            if (provinces.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#999;">Нет дивизионов</p>';
                return;
            }

            let html = '';
            provinces.forEach(prov => {
                html += `
                    <div class="province-card">
                        <div class="province-title">
                            ${prov.name}
                            <span style="font-size:12px; color:#666;">ID: ${prov.id}</span>
                            <button onclick="editProvinceValues(${prov.id})" class="btn-small" style="background:#3498db; color:white; float:right;">✏️ Редактировать характеристики</button>
                        </div>
                        <div class="province-fields">
                            <div class="field">
                                <label>Название</label>
                                <input type="text" id="name-${prov.id}" value="${prov.name}">
                            </div>
                            <div class="field">
                                <label>Столица</label>
                                <input type="text" id="capital-${prov.id}" value="${prov.capital || ''}">
                            </div>
                            <div class="field">
                                <label>Губернатор</label>
                                <input type="text" id="governor-${prov.id}" value="${prov.governor || ''}">
                            </div>
                            <div class="field" style="grid-column: span 2;">
                                <label>Описание</label>
                                <textarea id="description-${prov.id}" rows="2">${prov.description || ''}</textarea>
                            </div>
                        </div>
                        <div class="btn-group">
                            <button onclick="saveProvince(${prov.id})" class="btn-save">💾 Сохранить</button>
                            <button onclick="deleteProvince(${prov.id})" class="btn-delete">🗑️ Удалить</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // ==================== УПРАВЛЕНИЕ ПРОВИНЦИЯМИ ====================

        async function saveProvince(id) {
            const updatedProvince = {
                name: document.getElementById(`name-${id}`).value,
                capital: document.getElementById(`capital-${id}`).value,
                governor: document.getElementById(`governor-${id}`).value,
                description: document.getElementById(`description-${id}`).value
            };
            
            const response = await fetch(`/api/admin/provinces/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedProvince)
            });
            
            if (response.ok) {
                showMessage('✅ Сохранено!', 'success');
                loadProvinces();
            } else {
                showMessage('❌ Ошибка', 'error');
            }
        }

        async function addProvince() {
            const name = document.getElementById('newName').value.trim();
            if (!name) {
                showMessage('Введите название!', 'error');
                return;
            }
            
            const newProvince = {
                name: name,
                capital: document.getElementById('newCapital').value.trim(),
                governor: document.getElementById('newGovernor').value.trim(),
                description: document.getElementById('newDescription').value.trim()
            };
            
            const response = await fetch('/api/admin/provinces', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newProvince)
            });
            
            if (response.ok) {
                showMessage(`✅ Дивизион "${name}" добавлен!`, 'success');
                document.getElementById('newName').value = '';
                document.getElementById('newCapital').value = '';
                document.getElementById('newGovernor').value = '';
                document.getElementById('newDescription').value = '';
                loadProvinces();
            } else {
                const data = await response.json();
                showMessage(data.error || 'Ошибка', 'error');
            }
        }

        async function deleteProvince(id) {
            const name = document.getElementById(`name-${id}`).value;
            if (!confirm(`Удалить "${name}"?`)) return;
            
            const response = await fetch(`/api/admin/provinces/${id}`, { method: 'DELETE' });
            if (response.ok) {
                showMessage(`✅ "${name}" удалён`, 'success');
                loadProvinces();
            }
        }

        // ==================== ДОБАВЛЕНИЕ ПРИМЕРОВ ====================

        async function addExampleProvinces() {
            const examples = [
                { name: 'Дакка', capital: 'Дакка', governor: 'Абдул Маннан', description: 'Столичный дивизион, крупнейший экономический центр.' },
                { name: 'Читтагонг', capital: 'Читтагонг', governor: 'Мохаммад Абдул Маннан', description: 'Второй по величине дивизион, важный портовый регион.' },
                { name: 'Силхет', capital: 'Силхет', governor: 'Джаханг Хоссейн', description: 'Северо-восточный регион, известный чайными плантациями.' },
                { name: 'Кхулна', capital: 'Кхулна', governor: 'Мохаммад Абдул Азиз', description: 'Юго-западный регион, где находится Сундарбан.' },
                { name: 'Раджшахи', capital: 'Раджшахи', governor: 'Абдул Хамид', description: 'Северный регион, аграрный центр.' },
                { name: 'Рангпур', capital: 'Рангпур', governor: 'Мохаммад Ильяс', description: 'Северный регион, известный историческими дворцами.' },
                { name: 'Маймансингх', capital: 'Маймансингх', governor: 'Мохаммад Шахидулла', description: 'Центральный регион с развитым сельским туризмом.' },
                { name: 'Барисал', capital: 'Барисал', governor: 'Мохаммад Хан', description: 'Южный регион с речными круизами и офшорным газом.' }
            ];
            
            for (const prov of examples) {
                await fetch('/api/admin/provinces', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(prov)
                });
            }
            showMessage('✅ Добавлены примеры дивизионов!', 'success');
            loadProvinces();
        }

        async function clearAllProvinces() {
            if (!confirm('Удалить ВСЕ дивизионы?')) return;
            const confirmText = prompt('Введите "ДА" для подтверждения');
            if (confirmText !== 'ДА') return;
            
            await fetch('/api/admin/provinces', { method: 'DELETE' });
            showMessage('✅ Все удалены', 'success');
            loadProvinces();
        }

        function refreshData() {
            loadProvinces();
            showMessage('🔄 Обновлено', 'success');
        }

        // ==================== РЕДАКТИРОВАНИЕ ЗНАЧЕНИЙ ХАРАКТЕРИСТИК ====================

        async function editProvinceValues(provinceId) {
            currentProvinceId = provinceId;
            const province = allProvinces.find(p => p.id === provinceId);
            currentProvinceName = province ? province.name : '';
            
            document.getElementById('modalProvinceName').textContent = `Дивизион: ${currentProvinceName}`;
            
            // Получаем характеристики и их значения
            const attrsResponse = await fetch('/api/admin/attributes');
            const attributes = await attrsResponse.json();
            
            const valuesResponse = await fetch(`/api/provinces/${provinceId}/attributes`);
            const values = await valuesResponse.json();
            
            let html = '';
            attributes.forEach(attr => {
                const value = values.find(v => v.attribute_id === attr.id);
                let currentValue = '';
                if (value) {
                    if (value.value_text) currentValue = value.value_text;
                    else if (value.value_number !== null) currentValue = value.value_number;
                    else if (value.value_boolean !== null) currentValue = value.value_boolean ? 'true' : 'false';
                    else if (value.value_date) currentValue = value.value_date;
                }
                
                html += `
                    <div class="value-group">
                        <label>${attr.label}${attr.unit ? ' (' + attr.unit + ')' : ''}</label>
                        <input type="text" id="val-${attr.id}" value="${currentValue}" placeholder="Введите значение...">
                    </div>
                `;
            });
            
            document.getElementById('valueForm').innerHTML = html;
            document.getElementById('valueModal').style.display = 'flex';
        }

        function closeValueModal() {
            document.getElementById('valueModal').style.display = 'none';
            currentProvinceId = null;
        }

        async function saveProvinceValues() {
            if (!currentProvinceId) return;
            
            const inputs = document.querySelectorAll('#valueForm input');
            const attributes = {};
            
            inputs.forEach(input => {
                const attrId = input.id.replace('val-', '');
                attributes[attrId] = input.value;
            });
            
            const response = await fetch(`/api/admin/provinces/${currentProvinceId}/attributes`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ attributes })
            });
            
            if (response.ok) {
                showMessage('✅ Характеристики сохранены!', 'success');
                closeValueModal();
                loadProvinces();
            } else {
                showMessage('❌ Ошибка сохранения', 'error');
            }
        }

        // Закрытие модального окна при клике вне его
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('modal')) {
                closeValueModal();
            }
        });

        // Инициализация
        loadProvinces();
        checkAuth();
    </script>
</body>
</html>
