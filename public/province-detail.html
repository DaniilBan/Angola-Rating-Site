<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка дивизиона Бангладеш</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .province-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .stat-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            transition: transform 0.3s;
        }
        .stat-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .priority-1 { background: #e74c3c; color: white; }
        .priority-2 { background: #e67e22; color: white; }
        .priority-3 { background: #f39c12; color: white; }
        .priority-4 { background: #27ae60; color: white; }
        .priority-5 { background: #3498db; color: white; }
        .note-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .note-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }
        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .note-title {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }
        .note-meta {
            font-size: 12px;
            color: #666;
        }
        .like-btn {
            cursor: pointer;
            color: #e74c3c;
            font-size: 18px;
            transition: transform 0.3s;
        }
        .like-btn:hover {
            transform: scale(1.2);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .priority-select {
            display: flex;
            gap: 10px;
            margin: 10px 0;
            flex-wrap: wrap;
        }
        .priority-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.3s, opacity 0.3s;
            opacity: 0.5;
        }
        .priority-option:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }
        .priority-option.active {
            opacity: 1;
            transform: scale(1.1);
            border: 2px solid #2c3e50;
        }
        .btn-small {
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            margin: 0 3px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #3498db;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            .province-header {
                padding: 20px;
            }
            .modal-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="container">
            <h1 id="provinceName">Загрузка...</h1>
            <div class="nav-bar">
                <nav>
                    <a href="/">Главная</a>
                    <a href="/rating.html">🏆 Рейтинг</a>
                    <a href="/economy.html">📊 Экономика</a>
                    <div class="auth-buttons">
                        <a href="/login.html">Вход</a>
                        <a href="/register.html">Регистрация</a>
                    </div>
                </nav>
            </div>
        </div>
    </header>

    <main class="container">
        <a href="/" class="back-link">← На главную</a>
        
        <div id="provinceContent"></div>
        
        <div class="card">
            <h2>📊 Характеристики дивизиона</h2>
            <div id="attributesContainer">
                <div class="loader"></div>
            </div>
        </div>
        
        <div class="card">
            <h2>📝 Заметки пользователей</h2>
            <button onclick="showAddNoteModal()" class="btn" id="addNoteBtn" style="margin-bottom: 15px;">➕ Добавить заметку</button>
            <div id="notesList"></div>
        </div>
    </main>

    <div id="noteModal" class="modal">
        <div class="modal-content">
            <h3>✏️ Новая заметка</h3>
            <form id="noteForm">
                <div class="form-group">
                    <label>Заголовок</label>
                    <input type="text" id="noteTitle" required>
                </div>
                <div class="form-group">
                    <label>Текст заметки</label>
                    <textarea id="noteContent" rows="5" required></textarea>
                </div>
                <div class="form-group">
                    <label>Приоритет (1 - высший, 5 - низший)</label>
                    <div class="priority-select" id="prioritySelect">
                        <div class="priority-option priority-1" data-priority="1">1</div>
                        <div class="priority-option priority-2" data-priority="2">2</div>
                        <div class="priority-option priority-3" data-priority="3">3</div>
                        <div class="priority-option priority-4" data-priority="4">4</div>
                        <div class="priority-option priority-5" data-priority="5">5</div>
                    </div>
                    <input type="hidden" id="notePriority" value="3">
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="notePublic" checked> Публичная заметка
                    </label>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button type="submit" class="btn">Сохранить</button>
                    <button type="button" onclick="closeModal()" class="btn" style="background: #95a5a6;">Отмена</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const provinceId = urlParams.get('id');
        let currentUser = null;
        let provinceData = null;

        async function loadProvinceDetail() {
            try {
                const response = await fetch(`/api/provinces/${provinceId}/detail`);
                provinceData = await response.json();
                
                document.getElementById('provinceName').textContent = provinceData.name;
                renderProvinceContent();
            } catch (error) {
                console.error('Ошибка:', error);
            }
        }

        function renderProvinceContent() {
            if (!provinceData) return;
            
            document.getElementById('provinceContent').innerHTML = `
                <div class="province-header">
                    <h2>${provinceData.name}</h2>
                    <p>${provinceData.description || 'Нет описания'}</p>
                </div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <strong>🏛️ Столица</strong><br>
                        ${provinceData.capital || '—'}
                    </div>
                    <div class="stat-item">
                        <strong>👨‍💼 Губернатор</strong><br>
                        ${provinceData.governor || '—'}
                    </div>
                </div>
            `;
        }

        async function loadProvinceAttributes() {
            try {
                const response = await fetch(`/api/provinces/${provinceId}/with-attributes`);
                if (!response.ok) throw new Error('Ошибка загрузки');
                const data = await response.json();
                
                if (!data.attributes || data.attributes.length === 0) {
                    document.getElementById('attributesContainer').innerHTML = 
                        '<p style="text-align:center;color:#999;padding:20px;">Нет характеристик для этого дивизиона</p>';
                    return;
                }
                
                let html = '<div class="stats-grid">';
                data.attributes.forEach(attr => {
                    const value = data.values.find(v => v.attribute_id === attr.id);
                    let displayValue = '—';
                    if (value) {
                        if (value.value_text) {
                            displayValue = value.value_text;
                        } else if (value.value_number !== null) {
                            displayValue = Number.isInteger(value.value_number) ? 
                                value.value_number : 
                                parseFloat(value.value_number).toFixed(1);
                        } else if (value.value_boolean !== null) {
                            displayValue = value.value_boolean ? '✅ Да' : '❌ Нет';
                        } else if (value.value_date) {
                            displayValue = value.value_date;
                        }
                    }
                    
                    html += `
                        <div class="stat-item">
                            <strong>${attr.label}</strong><br>
                            <span style="font-size:20px;font-weight:bold;color:#2c3e50;">${displayValue}</span>
                            ${attr.unit ? `<br><small style="color:#666;">${attr.unit}</small>` : ''}
                        </div>
                    `;
                });
                html += '</div>';
                document.getElementById('attributesContainer').innerHTML = html;
                
            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('attributesContainer').innerHTML = 
                    '<p style="text-align:center;color:red;padding:20px;">❌ Ошибка загрузки характеристик</p>';
            }
        }

        async function loadNotes() {
            try {
                const response = await fetch(`/api/provinces/${provinceId}/notes`);
                const notes = await response.json();
                
                if (notes.length === 0) {
                    document.getElementById('notesList').innerHTML = '<p style="text-align:center;color:#999;padding:20px;">Нет заметок. Будьте первым!</p>';
                    return;
                }
                
                let html = '';
                for (const note of notes) {
                    const priorityClass = `priority-${note.priority}`;
                    const canEdit = currentUser && (currentUser.id === note.user_id || currentUser.role === 'admin');
                    
                    html += `
                        <div class="note-card">
                            <div class="note-header">
                                <div>
                                    <span class="note-title">${escapeHtml(note.title)}</span>
                                    <span class="priority-option ${priorityClass}" style="display:inline-block;width:30px;height:30px;font-size:12px;margin-left:10px;text-align:center;line-height:30px;border-radius:50%;">${note.priority}</span>
                                </div>
                                <div>
                                    <span class="like-btn" onclick="likeNote(${note.id})">❤️ ${note.likes_count || 0}</span>
                                    ${canEdit ? `<button onclick="deleteNote(${note.id})" class="btn-small" style="background:#e74c3c;color:white;">🗑️</button>` : ''}
                                </div>
                            </div>
                            <div class="note-meta">
                                👤 ${escapeHtml(note.username)} | 
                                📅 ${new Date(note.created_at).toLocaleString('ru-RU')}
                                ${!note.is_public ? ' | 🔒 Приватная' : ''}
                            </div>
                            <p style="margin-top:10px;white-space:pre-wrap;">${escapeHtml(note.content)}</p>
                        </div>
                    `;
                }
                document.getElementById('notesList').innerHTML = html;
            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('notesList').innerHTML = '<p style="color:red;">Ошибка загрузки заметок</p>';
            }
        }

        document.getElementById('noteForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const note = {
                province_id: provinceId,
                title: document.getElementById('noteTitle').value,
                content: document.getElementById('noteContent').value,
                priority: parseInt(document.getElementById('notePriority').value),
                is_public: document.getElementById('notePublic').checked ? 1 : 0
            };
            
            const response = await fetch('/api/notes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(note)
            });
            
            if (response.ok) {
                closeModal();
                loadNotes();
                document.getElementById('noteForm').reset();
                document.getElementById('notePriority').value = 3;
                document.querySelectorAll('.priority-option').forEach(o => o.classList.remove('active'));
            } else {
                alert('❌ Ошибка при создании заметки');
            }
        });

        async function likeNote(noteId) {
            if (!currentUser) {
                alert('Войдите чтобы поставить лайк');
                return;
            }
            const response = await fetch(`/api/notes/${noteId}/like`, { method: 'POST' });
            if (response.ok) loadNotes();
        }

        async function deleteNote(noteId) {
            if (confirm('Удалить заметку?')) {
                const response = await fetch(`/api/notes/${noteId}`, { method: 'DELETE' });
                if (response.ok) loadNotes();
            }
        }

        document.querySelectorAll('.priority-option').forEach(opt => {
            opt.addEventListener('click', function() {
                const priority = this.dataset.priority;
                document.getElementById('notePriority').value = priority;
                document.querySelectorAll('.priority-option').forEach(o => o.classList.remove('active'));
                this.classList.add('active');
            });
        });

        function showAddNoteModal() {
            if (!currentUser) {
                alert('Войдите чтобы добавить заметку');
                return;
            }
            document.getElementById('noteModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('noteModal').style.display = 'none';
        }

        document.getElementById('noteModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatNumber(num) {
            if (!num) return '0';
            if (num >= 1000000) return (num / 1000000).toFixed(1) + ' млн';
            if (num >= 1000) return (num / 1000).toFixed(1) + ' тыс';
            return num.toString();
        }

        async function loadCurrentUser() {
            try {
                const response = await fetch('/api/me');
                if (response.ok) {
                    currentUser = await response.json();
                    if (!currentUser) {
                        document.getElementById('addNoteBtn').style.display = 'none';
                    }
                    loadProvinceAttributes();
                } else {
                    currentUser = null;
                    document.getElementById('addNoteBtn').style.display = 'none';
                }
            } catch (error) {
                console.error('Ошибка загрузки пользователя:', error);
                currentUser = null;
            }
        }

        if (!provinceId) {
            document.getElementById('provinceName').textContent = 'Ошибка';
            document.getElementById('provinceContent').innerHTML = '<p style="color:red;text-align:center;padding:40px;">❌ Не указан ID дивизиона</p>';
        } else {
            loadCurrentUser();
            loadProvinceDetail();
            loadNotes();
            checkAuth();
        }
    </script>
</body>
</html>
